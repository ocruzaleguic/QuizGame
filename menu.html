<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body data-page="menu">

    <div class="container">

        <h2 class="menu"> Menú Principal </h2>
         <p id="currentArea" class="current-area"></p>
        <div class="menu-group">
            <p class="user-xp"> XP actual: <span id="xpValue">0</span></p>
            <p class="user-coins"> Monedas: <span id="coinsValue">0</span></p>
        </div>

        <div class="menu-options scroll-hidden">

            <button class="btn-primary" onclick="location.href='quiz.html'"> Play </button>
            <button class="btn-primary" onclick="location.href='seleccion-area.html'"> Cambiar área </button>
            <button class="btn-primary" onclick="location.href='store.html'"> Tienda </button>

            <div class="menu-group">
                <button class="btn-secondary" onclick="location.href='achievements.html'"> Logros </button>
                <button class="btn-secondary" onclick="location.href='ranking.html'"> Ranking </button>
            </div>

            <button class="btn-primary" onclick="location.href='settings.html'"> Settings </button>
            <button class="btn-primary" onclick="logout()"> Logout </button>

        </div>

    </div>

    <!-- SEGURIDAD -->
    <script type="module">
        import { requireAuth, lsGet } from "./js/utils.js";
        import { logout } from "./js/auth.js";
        import { showSelectedArea } from "./js/areaselect.js";

        document.addEventListener("DOMContentLoaded", () => {
            requireAuth();

            // Mostrar XP y coins
            const user = lsGet("loggedUser");

            const xpElement = document.getElementById("xpValue");
            xpElement.textContent = user?.gamification?.XP ?? 0;

            const coinsElement = document.getElementById("coinsValue");
            coinsElement.textContent = user?.gamification?.coins ?? 0;

            // Mostrar área seleccionada
            showSelectedArea("currentArea");
        });

        window.logout = logout;
    </script>


</body>

</html>
